<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-label="Scoring stays in the kernel; the calculator only renders the trace" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7785"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="292" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2933">Scoring stays in the kernel; the calculator only renders the trace</text>
  <g fill="none" stroke="#6b7785" stroke-width="1.25">
    <path d="M236 94H274" marker-end="url(#arch-arrow)"/>
    <path d="M274 130H236" marker-end="url(#arch-arrow)"/>
    <path d="M486 94H524" marker-end="url(#arch-arrow)"/>
    <path d="M524 130H486" marker-end="url(#arch-arrow)"/>
    <path d="M630 160V212" marker-end="url(#arch-arrow)"/>
    <path d="M274 240H130V160" marker-end="url(#arch-arrow)"/>
  </g>
  <g>
    <rect x="24" y="64" width="212" height="96" rx="8" fill="none" stroke="#6b7785" stroke-width="1.25"/>
    <text x="130" y="88" text-anchor="middle" font-weight="600" fill="#1f2933">Joker Calculator (UI)</text>
    <text x="130" y="110" text-anchor="middle" font-size="11.5" fill="#52606d">Joker cards + breakdown table</text>
    <text x="130" y="126" text-anchor="middle" font-size="11.5" fill="#52606d">Edits become BoardSpec JSON</text>
    <text x="130" y="142" text-anchor="middle" font-size="11.5" fill="#52606d">No scoring arithmetic</text>
  </g>
  <g>
    <rect x="274" y="64" width="212" height="96" rx="8" fill="none" stroke="#6b7785" stroke-width="1.25"/>
    <text x="380" y="88" text-anchor="middle" font-weight="600" fill="#1f2933">funky-wasm adapter</text>
    <text x="380" y="110" text-anchor="middle" font-size="11.5" fill="#52606d">wasm-bindgen + serde_json</text>
    <text x="380" y="126" text-anchor="middle" font-size="11.5" fill="#52606d">BoardSpec to BuffoonBoard</text>
    <text x="380" y="142" text-anchor="middle" font-size="11.5" fill="#52606d">ScoreTrace to JSON</text>
  </g>
  <g>
    <rect x="524" y="64" width="212" height="96" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"/>
    <text x="630" y="88" text-anchor="middle" font-weight="600" fill="#1f2933">cardpack::funky (kernel)</text>
    <text x="630" y="110" text-anchor="middle" font-size="11.5" fill="#1f2933">BuffoonBoard::score_traced()</text>
    <text x="630" y="126" text-anchor="middle" font-size="11.5" fill="#1f2933">folds emit one ScoreStep each</text>
    <text x="630" y="142" text-anchor="middle" font-size="11.5" fill="#1f2933">pure: no I/O, no JS types</text>
  </g>
  <g>
    <rect x="274" y="212" width="462" height="56" rx="8" fill="#f1f4f8" stroke="#6b7785" stroke-width="1.25"/>
    <text x="505" y="236" text-anchor="middle" font-weight="600" fill="#1f2933">joker-catalog.json</text>
    <text x="505" y="254" text-anchor="middle" font-size="11.5" fill="#52606d">built from funky::decks::joker: name, rarity, cost, MPip, Blank reason</text>
  </g>
  <text x="255" y="56" text-anchor="middle" font-size="11.5" fill="#52606d">BoardSpec</text>
  <text x="505" y="56" text-anchor="middle" font-size="11.5" fill="#52606d">BuffoonBoard</text>
  <text x="255" y="176" text-anchor="middle" font-size="11.5" fill="#52606d">ScoreTrace (JSON)</text>
  <text x="505" y="176" text-anchor="middle" font-size="11.5" fill="#52606d">ScoreTrace</text>
  <text x="642" y="190" font-size="11.5" fill="#52606d">build step</text>
</svg>
