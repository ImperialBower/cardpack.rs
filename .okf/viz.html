const NODES=[{"id": "architecture/card-model", "type": "Architecture", "title": "Card model \u2014 Pip, BasicCard, Card, Pile", "description": "The four-layer generic card model and the traits (DeckedBase, Decked, Ranged) that turn a type into a deck.", "tags": ["architecture", "types", "generics"], "group": "architecture", "sz": 34, "body": "# The layered model\n\nFrom smallest to largest (all in `src/basic/types/`):\n\n| Type | File | Role |\n|---|---|---|\n| `Pip` | `pips.rs` | Atomic rank-or-suit facet: symbol, index char, and a **weight** used for sorting/precedence |\n| `BasicCard` | `basic_card.rs` | Rank `Pip` + suit `Pip`, no generic constraints \u2014 the raw data of a card |\n| `Card\u003cT>` | `card.rs` | Generic wrapper around `BasicCard` where `T: DeckedBase` binds the card to a deck vocabulary |\n| `Pile\u003cT>` | `pile.rs` | Ordered collection of `Card\u003cT>`: construct, draw, sort, shuffle, extract, validate |\n\nKey consequence: **weight lives inside the card**. Sorting is data-driven, so\nan Ace-low game needs a separate deck type with inverted rank weights (the\n`Razz` deck is the shipped example) rather than a comparator.\n\n# Traits (`src/basic/types/traits.rs`)\n\n* **`DeckedBase`** \u2014 what a type must provide to *be* a deck: `base_vec()`\n  (the canonical `Vec\u003cBasicCard>`), `colors()`, `deck_name()`,\n  `fluent_deck_key()`. Implementing it on a marker struct is the whole\n  extension mechanism ([extending decks](/decks/extending-decks.md)).\n* **`Decked\u003cT>`** \u2014 convenience layer: `T::deck()`, `T::decks(n)` (multi-deck\n  games like Hand and Foot), `validate()`.\n* **`Ranged`** \u2014 combinatorics (`combos(k)` etc.); every deck gets it. The\n  funky engine reuses it for poker-hand detection.\n\n# Conventions\n\n* Canonical deck order is high-to-low rank, suit-major (spades \u2192 hearts \u2192\n  diamonds \u2192 clubs for French-family decks).\n* Two string forms round-trip: symbol strings (`A\u2660 K\u2660 \u2026`) and index strings\n  (`AS KS \u2026`). Jokers use `B`/`L` (big/little) with suit symbol `\ud83c\udcdf`.\n* `draw(n)` is all-or-nothing (`Option`); `draw_first`/`draw_last` deal from\n  top/bottom. Note: top-of-deck is the *front* of the vector today\n  (`remove(0)`, O(n)) \u2014 a tracked refactor candidate in the\n  [technical debt register](/references/technical-debt.md).\n* Macros (`card!`, `cards!`, `french_cards!`) parse index strings into typed\n  cards.\n\n# Citations\n\n[1] [src/lib.rs module docs](../../src/lib.rs)\n[2] [DECON-01 Card Model](/references/decon-01-card-model.md)\n[3] [DECON-02 Pile Operations](/references/decon-02-pile-operations.md)"}, {"id": "architecture/crate-overview", "type": "Rust Crate", "title": "cardpack \u2014 Generic Deck of Cards", "description": "Pure-by-default no_std Rust library modeling playing-card decks, with opt-in std, i18n, serde, YAML, and a Balatro-style engine.", "tags": ["crate", "overview", "no_std"], "group": "architecture", "sz": 32, "body": "# What it is\n\n`cardpack` (v0.8.1, Rust 2024 edition, MSRV 1.85, Apache-2.0) is a generic\npack-of-cards library. Its responsibilities:\n\n* Represent specific types of card decks ([deck catalog](/decks/deck-catalog.md)).\n* Validate that a collection of cards is valid for a deck type.\n* Render/parse textual representations (symbol strings like `A\u2660`, index\n  strings like `AS`).\n* Shuffle \u2014 including deterministic seeded shuffle that works under `no_std`.\n* Localize card names via Project Fluent\n  ([localization](/architecture/localization.md)).\n\nA bare dependency is an **alloc-only, `no_std`, no-I/O domain kernel**; every\ndependency-bearing capability is opt-in via Cargo features\n([feature flags](/architecture/feature-flags.md),\n[domain kernel](/architecture/domain-kernel.md)).\n\n# Module map (`src/lib.rs`)\n\n| Module | Gate | Contents |\n|---|---|---|\n| `basic` | always | Core types ([card model](/architecture/card-model.md)) and all shipped decks |\n| `common` | always | Errors (`thiserror`) and utilities |\n| `funky` | `funky` feature | Balatro-style engine ([funky engine](/architecture/funky-engine.md)) |\n| `localization` | `i18n` feature | Fluent locales |\n| `prelude` | always | `use cardpack::prelude::*` \u2014 the intended import surface |\n| `preludes::funky` | `funky` feature | Prelude for the funky engine |\n\n# Lint posture\n\n`src/lib.rs` warns on `clippy::all/pedantic/nursery/cargo/suspicious` plus\n`unwrap_used`/`expect_used` in production paths; `unwrap`/`expect` are allowed\nunder `cfg(test)`. CI keeps the whole crate clippy-pedantic-clean at\n`--all-targets`.\n\n# Citations\n\n[1] [Cargo.toml](../../Cargo.toml)\n[2] [src/lib.rs](../../src/lib.rs)\n[3] [README.md](/references/readme.md)"}, {"id": "architecture/domain-kernel", "type": "Architecture", "title": "Domain-kernel posture", "description": "cardpack is a value-type domain kernel \u2014 pure by default, no I/O in the core, format crates kept out of the public API.", "tags": ["architecture", "purity", "domain-kernel", "audit"], "group": "architecture", "sz": 32, "body": "# The pattern\n\nThe crate follows the **domain-kernel** pattern: a pure, delivery-agnostic\ncore behind a narrow boundary. It is a *value/collection* kernel (cards, pips,\npiles, decks) rather than a state-machine kernel \u2014 there is no game state, no\nacting parties, no hidden information. The kernel's value is **purity +\nportability** (no_std, wasm, bare-metal), not a transition contract; a WIT/\ncomponent boundary was assessed and explicitly *not* recommended.\n\n# Invariants enforced\n\n1. **Pure \u2014 no I/O of its own.** The only filesystem touch in the whole crate\n   is `BasicCard::cards_from_yaml_file`, quarantined behind the `std-io`\n   feature ([decision](/decisions/std-io-outside-full.md)). The historical\n   violation \u2014 `Razz::base_vec()` reading `razz.yaml` from the CWD at runtime,\n   silently returning an empty deck on failure \u2014 was fixed by embedding the\n   YAML with `include_str!`.\n2. **No format/transport crate in the public API.** Errors are boxed;\n   `serde_norway::Error` does not leak.\n3. **Pure by default.** `default = []`\n   ([feature flags](/architecture/feature-flags.md)). This was the other 2026-07\n   audit finding: defaults used to pull in presentation, YAML, i18n, and\n   fs-loading.\n4. **Delivery-agnostic.** CI gates no_std/alloc, wasm32, and bare-metal\n   (`thumbv7em-none-eabihf`) builds ([build and test](/workflows/build-and-test.md)).\n\n# Where it's documented\n\nThe authoritative assessment is the\n[domain-kernel audit](/references/audit-domain-kernel.md)\n(`docs/audit-2026-07-18-domain-kernel.md` \u2014 scorecard, findings, fix\nsequencing). Cargo.toml's `[features]` comment cites it as \"Invariant 3.\"\n\n# Citations\n\n[1] [docs/audit-2026-07-18-domain-kernel.md](/references/audit-domain-kernel.md)\n[2] [Cargo.toml](../../Cargo.toml)"}, {"id": "architecture/feature-flags", "type": "Architecture", "title": "Cargo feature flags", "description": "The pure-by-default feature matrix \u2014 default is an alloc-only no_std kernel; std, i18n, color, yaml, serde, std-io, and funky are opt-in.", "tags": ["features", "cargo", "no_std", "purity"], "group": "architecture", "sz": 46, "body": "# Principle\n\n`default = []`. A bare `cardpack` dependency is an alloc-only, `no_std`,\nno-I/O kernel ([domain kernel](/architecture/domain-kernel.md)). Everything\nelse is opt-in.\n\n# Matrix\n\n| Feature | In `full`? | Pulls in | Turns on |\n|---|---|---|---|\n| `full` | \u2014 | everything below except `std-io`/`funky` | `std` + `i18n` + `colored-display` + `yaml` + `serde` |\n| `std` | yes | libstd | thread-RNG shuffle, `draw_random`, etc. |\n| `alloc` | (implied) | \u2014 | base of the kernel; `serde?/alloc` |\n| `i18n` | yes | `fluent-templates` (implies `std`) | `FluentName`, `Named`, `Card::fluent_name*`, [localization](/architecture/localization.md) |\n| `colored-display` | yes | `colored` (implies `std`) | `Color`, `Card::color*`, `Pile::to_color_*` |\n| `yaml` | yes | `serde_norway` (implies `std`, `serde`) | Full deck \u2194 YAML round-tripping, pure and in-memory: `DeckYaml`, the `YamlDecked` blanket trait, `DeckKind::to_yaml`/`from_yaml`, `Pile::to_yaml`/`from_yaml`, `BasicCard::cards_from_yaml_str`, six `CardError::Yaml*` variants, and the `Razz` deck ([envelope decision](/decisions/yaml-envelope-format.md)) |\n| `serde` | yes | `serde` (implies `alloc`) | `Serialize`/`Deserialize` derives on `Pip`/`Card`/`Pile` etc. |\n| `std-io` | **no** | (implies `std`, `yaml`) | `BasicCard::cards_from_yaml_file` \u2014 the crate's one filesystem seam; deliberately excluded from `full` ([decision](/decisions/std-io-outside-full.md)) |\n| `funky` | **no** | (implies `std`, `serde`) | Balatro-style engine ([funky engine](/architecture/funky-engine.md)) |\n\n# Gotchas\n\n* `yaml` implies `serde` \u2014 it deserializes into the serde-derived structs.\n* `funky` implies `serde` \u2014 unlike the core (which gates serde behind\n  `#[cfg(feature = \"serde\")]`), every `src/funky/types/*` file `use`s and\n  derives serde **unconditionally**, so the `funky` feature must pull it in or\n  the module won't compile.\n* **Examples run flag-free via `cargo ex \u003cx>`**, an alias in\n  `.cargo/config.toml` expanding to `run --features full,funky --example`.\n  Keeping this in developer tooling is deliberate: a **self dev-dependency**\n  (`cardpack = { path = \".\", features = [\"full\", \"funky\"] }`) achieves the same\n  ergonomics but feature-activates those crates on cardpack's own node in\n  `cargo metadata`, which breaks `cargo deny check bans` and every host purity\n  gate \u2014 and no cargo-deny setting can undo it. Read\n  [the flag-free-examples decision](/decisions/examples-flag-free-alias.md)\n  before changing this.\n* Deck-from-YAML **without** the filesystem is available under plain `yaml`:\n  `cards_from_yaml_str` + compile-time `include_str!` (how `Razz` works). The\n  *write* side (`to_yaml`) is equally pure \u2014 it returns a `String`; nothing in\n  `yaml` touches `std::fs`. That is what keeps `std-io` a separate seam.\n* `yaml` is the only feature that changes `DeckKind::all()`'s **length**: the\n  `Razz` variant is gated, so the registry is 13 kinds without it and 14 with.\n  Anything sweeping the registry must read `DeckKind::all().len()` rather than\n  hardcode a count.\n* The `CardError::Yaml*` variants only exist under `yaml`, which is one reason\n  `CardError` is `#[non_exhaustive]` \u2014 exhaustive downstream matching could\n  never have been feature-portable.\n* `rand`'s `std_rng` feature is enabled unconditionally, *not* gated on\n  `std` \u2014 see [the rand decision](/decisions/rand-std-rng-unconditional.md)\n  before \"cleaning that up.\"\n* Doctests that need optional features are marked `ignore` with a comment so\n  `cargo test --no-default-features` stays green. **Prefer the ungated API\n  first** \u2014 reach for `ignore` only when there is no pure equivalent. Several\n  examples were needlessly `std`-only because they called `shuffle()`/\n  `shuffled()` (thread RNG, `#[cfg(feature = \"std\")]`) where\n  `shuffle_with_seed`/`shuffled_with_seed` are ungated and deterministic, which\n  makes the doctest both portable and reproducible.\n* `README.md` is pulled into the crate docs by\n  `#![cfg_attr(doc, doc = include_str!(\"../README.md\"))]`, so **its fenced\n  `rust` blocks are compiled as doctests too** and are attributed to `src/lib.rs`\n  line numbers in failure output. A README example using a gated API breaks\n  `cargo test --no-default-features --doc`. Note that gate runs the **doc**\n  tests; `--no-default-features --lib` (what most of the Makefile targets use)\n  will not catch it.\n\n# Citations\n\n[1] [Cargo.toml `[features]`](../../Cargo.toml)\n[2] [README \"Cargo features\"](/references/readme.md)"}, {"id": "architecture/funky-engine", "type": "Architecture", "title": "Funky \u2014 the Balatro-style engine", "description": "std-only feature-gated module modeling Balatro cards, jokers, scoring, shop, and vouchers on top of the core card model; EPIC-01 closed 2026-07-18 with named deferrals.", "tags": ["funky", "balatro", "feature-gated", "scoring"], "group": "architecture", "sz": 34, "body": "# What it is\n\n`src/funky/` (behind `funky = [\"std\", \"serde\"]`; every `funky/types/*` file\nuses and derives serde unconditionally, so the feature pulls in `serde`) models\n[Balatro](https://www.playbalatro.com/)-style cards well enough to (a) power a\nBalatro **score solver** and (b) enable **custom mod decks**. It layers on the\ncore [card model](/architecture/card-model.md) rather than forking it.\n\n# Key constructs\n\n* **`BuffoonCard`** (`funky/types/buffoon_card.rs`) \u2014 embeds core `Pip`s for\n  suit/rank, adds `card_type: BCardType`, `enhancement: MPip`, `resell_value`,\n  `debuffed`, `Edition`.\n* **`MPip`** (`funky/types/mpip.rs`) \u2014 the big idea: a ~69-variant enum making\n  card effects **data, not code**; interpreted at scoring time by\n  `calculate_plus_*` match arms.\n* **`BuffoonPile`** \u2014 implements the core `Ranged` trait so combinatorics and\n  hand detection delegate to the mature `basic` engine.\n* **Scoring** \u2014 four-phase chips \u00d7 mult pipeline (`score()` /\n  `score_with_seed()`): base + played cards + held \u00d7mult + jokers left-to-right;\n  never panics; seeded shuffle for determinism.\n* **Decks** (`funky/decks/`): basic (52/Abandoned 40/Checkered), 112 jokers,\n  12 planets, 22 tarot, 18 spectral.\n* **Economy**: `Shop` (stock, rerolls, booster packs, voucher slot), 20 wired\n  `Voucher`s, `sell_joker`, blind state with 3 boss blinds.\n\n# Status (EPIC-01, closed 2026-07-18)\n\nAll five child EPICs (01a\u201301e) are closed; both stated goals are structurally\nmet. **Named deferrals** to future EPICs: Seals (blocks 4 seal spectrals),\nmost Decks (~3 of 16), Antes/Bosses, Tags, Serde. 8 of 112 jokers stay `Blank`\nwith a test-enforced reason list (`BLANK_WITH_REASON`).\n\n# Try it\n\n```shell\ncargo run --example buffoon --features funky      # 4-phase scoring, phase by phase\ncargo run --example funky_tour --features funky   # seeded tour: rounds, editions, shop, spectrals\n```\n\n# Citations\n\n[1] [docs/EPIC-01_Funky.md](/references/epic-01-funky.md)\n[2] [README \"Funky\"](/references/readme.md)\n[3] [docs/2026-07-11-effect-registry-design.md](/references/effect-registry-design.md)"}, {"id": "architecture/localization", "type": "Architecture", "title": "Localization (Fluent i18n)", "description": "Card, rank, and suit names resolve per locale via Project Fluent \u2014 en-US, de, fr, la (Latin), tlh (Klingon) \u2014 behind the i18n feature.", "tags": ["i18n", "fluent", "locales"], "group": "architecture", "sz": 31, "body": "# How it works\n\nBehind the `i18n` feature (implies `std`), `src/localization/` uses\n[fluent-templates](https://github.com/XAMPPRocky/fluent-templates) to resolve\ncard names. `Card::fluent_name_default()` gives English;\n`Card::fluent_name(&FluentName::DEUTSCH)` etc. select a locale. Each deck type\ncarries a `fluent_deck_key()` ([card model](/architecture/card-model.md))\nthat routes lookups to the right `.ftl` resource set (`french`, `skat`,\n`tarot`, `mughal`, `dashavatara`).\n\n# Locales\n\n| Locale | Dir | Notes |\n|---|---|---|\n| English | `locales/en-US/` | reference locale |\n| German | `locales/de/` | |\n| French | `locales/fr/` | has a README on translation confidence |\n| Latin | `locales/la/` | draft-tier; see `docs/2026-04-29-la-tlh-locales-design.md` |\n| Klingon | `locales/tlh/` | draft-tier; same design doc |\n\nDraft locales use **confidence tiering** \u2014 see DECON-07 for the contract.\n\n# Known tension\n\nThe `fluent_*` path in `card.rs` carries `HACK` markers: the author suspects\nfluent-templates may be outliving its usefulness, with \"deck from YAML\"\nfloated as the successor direction\n([technical debt](/references/technical-debt.md)). Treat major\ninvestment here with caution.\n\n# Citations\n\n[1] [src/localization/](../../src/localization.rs)\n[2] [DECON-07 Localization](/references/decon-07-localization.md)\n[3] [docs/2026-04-29-la-tlh-locales-design.md](/references/la-tlh-locales-design.md)"}, {"id": "decisions/examples-flag-free-alias", "type": "Decision", "title": "Examples are flag-free via a cargo alias, never a self dev-dependency", "description": "`cargo ex \u003cname>` aliases `run --features full,funky --example`, keeping example ergonomics in developer tooling; a self dev-dependency was tried and reverted because it silently breaks `cargo deny check bans` and every host purity gate.", "tags": ["decision", "purity", "features", "examples", "ci", "cargo-deny"], "group": "decisions", "sz": 42, "body": "# Decision\n\nExamples are made flag-free by an **alias in `.cargo/config.toml`**:\n\n```toml\n[alias]\nex = \"run --features full,funky --example\"\n```\n\nSo `cargo ex demo` replaces `cargo run --features full,funky --example demo`.\n\n`Cargo.toml` must **not** carry a self dev-dependency\n(`cardpack = { path = \".\", features = [\"full\", \"funky\"] }`) for this purpose.\nThat approach was implemented, then reverted \u2014 see below.\n\n# Why\n\nThe crate is pure by default (`default = []`, Invariant 3 of the\n[domain kernel](/architecture/domain-kernel.md)), so every example touching\n`std`/`i18n`/`colored-display`/`yaml`/`funky` needs a `--features` flag.\nThe friction is real, but it belongs in **developer tooling**, not in the\ndependency graph. An alias is invisible to Cargo's resolver, so every purity\ngate keeps working and consumers are unaffected.\n\n# Why the self dev-dependency fails (load-bearing)\n\nA self dev-dep does **not** merely add a `(dev)` edge \u2014 it force-enables\n`full`+`funky` on the `cardpack` node of `cargo metadata`'s **feature-unified\nresolve**. Tools that read that resolve therefore see `colored`,\n`serde_norway`, and `fluent-templates` as **normal** dependencies of the\nkernel:\n\n```\nerror[banned]: crate 'colored = 3.1.1' is explicitly banned\n   \u251c colored v3.1.1\n     \u2514\u2500\u2500 cardpack v0.9.0        # \u003c- no (dev) marker\n```\n\n`cargo deny check bans` \u2014 the second step of the `kernel-purity` CI job \u2014\nfails, and **no cargo-deny setting can suppress it**. All of these were tried\nand all still report the four banned crates:\n\n* `cargo deny --exclude-dev check bans`\n* `[graph] exclude-dev = true`\n* `[graph] no-default-features = true`\n* the two combined\n\nThe dev *edge* is removable; the feature *activation* is not.\n\nTwo further casualties:\n\n* `wildcards = \"deny\"` flags `cardpack = { path = \".\" }` itself \u2014 a path\n  dependency carries no version requirement, so it reads as a wildcard.\n* The host purity gates stop testing anything, because Cargo builds all dev\n  artifacts with the features on: `cargo test --no-default-features --lib` is\n  no longer a pure lib test, and `cargo build --no-default-features --examples`\n  no longer catches a missing `required-features` declaration (nothing is\n  skipped anymore).\n\nNote that `cargo tree --locked --no-default-features --edges normal` stays\n**clean** throughout \u2014 `cargo tree` resolves features per-target correctly.\nThat divergence is the trap: the first step of `kernel-purity` passes while\nthe second fails, in the same job, for the same tree.\n\n# How to apply\n\n* Add new examples to the `[[example]]` list with accurate\n  `required-features`; they are what `cargo build --no-default-features\n  --examples` enforces.\n* Document the run command in the example's `# Features` doc header as\n  `cargo ex \u003cname>`.\n* If an example needs a feature outside `full`+`funky` (e.g. `std-io`), extend\n  the alias or run it explicitly \u2014 do not add the feature to `default`.\n* Do **not** reintroduce a self dev-dependency to \"improve\" ergonomics, and do\n  not silence the resulting cargo-deny failure with `[bans].skip` or by\n  deleting entries from `[bans].deny` \u2014 that removes the only automated proof\n  of [kernel purity](/architecture/domain-kernel.md).\n* Do **not** solve example friction by putting features in `default` instead \u2014\n  that violates Invariant 3 and breaks every no_std/wasm/bare-metal consumer\n  ([feature flags](/architecture/feature-flags.md)).\n\n# Citations\n\n[1] [.cargo/config.toml alias](../../.cargo/config.toml)\n[2] [Cargo.toml dev-dependencies warning comment](../../Cargo.toml)\n[3] [.github/workflows/CI.yaml `no-std-build` and `kernel-purity` jobs](../../.github/workflows/CI.yaml)\n[4] [deny.toml `[bans].deny` list](../../deny.toml)\n[5] [domain kernel \u2014 Invariant 3](/architecture/domain-kernel.md)"}, {"id": "decisions/rand-std-rng-unconditional", "type": "Decision", "title": "rand's std_rng stays unconditional", "description": "rand's std_rng feature is deliberately NOT gated on cardpack's std feature \u2014 moving it re-breaks seeded shuffle for no_std consumers.", "tags": ["decision", "rand", "no_std", "invariant"], "group": "decisions", "sz": 28, "body": "# Decision\n\nIn `Cargo.toml`, `rand = { \u2026, features = [\"std_rng\"] }` is unconditional \u2014\n**not** listed under cardpack's `std` feature.\n\n# Why\n\n`shuffle_with_seed` / `shuffled_with_seed` use `StdRng` and must work under\n`no_std` (a core promise of the [domain kernel](/architecture/domain-kernel.md)\n\u2014 determinism is part of the DECON-03 contract). In rand 0.9, `std_rng` only\npulls in `rand_chacha`, with no transitive `std`, so keeping it always-on is\nsound.\n\n# How to apply\n\nA tidy-minded refactor that moves `std_rng` under `std = [ \u2026, \"rand/std_rng\" ]`\nwill pass std-enabled CI but silently break seeded shuffle for `no_std`\nconsumers. The Cargo.toml comment says: **do NOT move it**. `make no-std`\n([build and test](/workflows/build-and-test.md)) is the guard that catches\nthis.\n\n# Citations\n\n[1] [Cargo.toml rand dependency comment](../../Cargo.toml)\n[2] [DECON-03 Shuffling and Determinism](/references/decon-03-shuffling.md)"}, {"id": "decisions/std-io-outside-full", "type": "Decision", "title": "std-io is excluded from full", "description": "The one filesystem API (cards_from_yaml_file) sits behind its own std-io feature, deliberately left out of the full umbrella so both kernel and convenience stack stay I/O-free.", "tags": ["decision", "purity", "features", "io"], "group": "decisions", "sz": 29, "body": "# Decision\n\n`BasicCard::cards_from_yaml_file` (reads a deck from a YAML *file* via\n`std::fs`) is the crate's **only** filesystem seam. It lives behind the\n`std-io` feature (`std-io = [\"std\", \"yaml\"]`), which is intentionally **not**\npart of the `full` umbrella.\n\n# Why\n\nKeeps both the pure kernel *and* the batteries-included `full` stack I/O-free\n(Invariant 1 of the [domain kernel](/architecture/domain-kernel.md)). Users\nwho want file loading must name the capability explicitly. Deck-from-YAML\nwithout the filesystem already exists under plain `yaml`:\n`cards_from_yaml_str` + `include_str!` (the `Razz` pattern \u2014\n[extending decks](/decks/extending-decks.md)).\n\n# How to apply\n\n* Don't add `std-io` to `full` \"for convenience\" \u2014 that reintroduces the\n  audit's Invariant-1/3 violation.\n* New I/O-adjacent APIs belong behind `std-io` (or a new named seam), never\n  in the core or in `full`.\n* `make test-std-io` exercises the seam separately\n  ([build and test](/workflows/build-and-test.md)).\n\n# Citations\n\n[1] [Cargo.toml std-io comment](../../Cargo.toml)\n[2] [docs/audit-2026-07-18-domain-kernel.md](/references/audit-domain-kernel.md)"}, {"id": "decisions/yaml-envelope-format", "type": "Decision", "title": "The YAML envelope adds a format \u2014 it does not replace the legacy sequence reader", "description": "DeckYaml's reader sniffs document shape and supports both the envelope and the legacy bare card sequence; deleting the legacy path passes every test in the new format and silently breaks Razz at build time.", "tags": ["decision", "yaml", "serialization", "decks", "compatibility"], "group": "decisions", "sz": 39, "body": "# Decision\n\n`DeckYaml::from_yaml` **sniffs document shape** before deserializing:\n\n* a YAML **mapping** \u2192 the v1 envelope (`version`, `name`, `fluent_deck_key`,\n  `count`, `cards`)\n* a YAML **sequence** \u2192 the legacy bare `Vec\u003cBasicCard>` list, parsed with an\n  empty `name`\n* anything else (a scalar) \u2192 `CardError::YamlMalformed`\n\nBoth branches are permanently supported. The envelope is a strict **superset**\nof the old format, not a migration away from it.\n`BasicCard::cards_from_yaml_str` keeps its exact signature and is routed\nthrough this reader, so it transparently gained envelope support.\n\n# Why\n\n**`src/basic/decks/yaml/razz.yaml` is a bare sequence, and `Razz::base_vec()`\nparses it at build time via `include_str!`.** Deleting the legacy branch as\n\"dead code left over from the old format\" would compile, would pass every test\nwritten against the envelope, and would break the `Razz` deck \u2014 the failure\nsurfacing as an empty deck plus a `log::error!`, not a compile error, because\n`base_vec()` swallows the parse error into `Vec::default()`.\n\nSo the two code paths look redundant and are not. A \"clean up the duplicate\nYAML readers\" refactor is exactly the change this note exists to stop.\n\nSecondary reason: the envelope carries deck **identity**. A bare list cannot\nsay which deck it is, which is why `DeckKind::from_yaml` rejects a legacy\nsequence with `YamlUnknownDeck(\"\")` \u2014 it has nothing to match against\n`all()`. Identity is what makes `validate_yaml`, the golden fixtures, and\nround-tripping through the registry possible at all.\n\n# How to apply\n\n* **Never delete the sequence branch** of `DeckYaml::from_yaml`, and never\n  rewrite `razz.yaml` into envelope form \"for consistency\". The `razz.yaml`\n  bytes are load-bearing; `tests/yaml_errors.rs` and the `Razz` fixture tests\n  are the tripwires.\n* Keep `cards_from_yaml_str`'s signature and contract stable \u2014 it is the\n  crate's oldest YAML entry point and public API.\n* New format versions bump the envelope's `version` field; they do not remove\n  readers.\n* Preserve the **empty-list asymmetry**: `Pile::from_yaml` accepts `cards: []`\n  (a fully-drawn pile is legitimate), while `DeckKind::from_yaml` and\n  `validate_yaml` reject it with `YamlEmptyDeck`. Harmonizing them\n  reintroduces the silent-empty-deck failure the `Razz` comment documents.\n* Validate membership, not cardinality, in `Pile::from_yaml` \u2014 `French::decks(4)`\n  is 216 cards and a dealt hand is five.\n* Golden fixtures under `tests/fixtures/yaml/` are compared **byte-for-byte**,\n  so `serde_norway` formatting is part of the contract. When a dependency bump\n  reformats output, regenerate with `make yaml-fixtures`, review the diff, and\n  note it in the CHANGELOG \u2014 do not loosen the check to parse-and-compare, as\n  that is precisely the drift it is there to catch.\n\n# Citations\n\n[1] [src/basic/types/deck_yaml.rs](../../src/basic/types/deck_yaml.rs)\n[2] [src/basic/decks/razz.rs `base_vec()`](../../src/basic/decks/razz.rs)\n[3] [src/basic/decks/yaml/razz.yaml](../../src/basic/decks/yaml/razz.yaml)\n[4] [EPIC-03 YAML Deck Serialization](/references/epic-03-yaml-serialization.md)\n[5] [Creating a custom deck](/decks/extending-decks.md)"}, {"id": "decks/deck-catalog", "type": "Catalog", "title": "Shipped deck catalog", "description": "The 14 deck kinds the crate ships, their sizes, and their quirks; DeckKind is the runtime registry over all of them.", "tags": ["decks", "catalog", "registry"], "group": "decks", "sz": 34, "body": "# The 14 deck kinds\n\nAll in `src/basic/decks/`, each a marker struct implementing `DeckedBase`\n([card model](/architecture/card-model.md)):\n\n| Deck | Cards | Notes |\n|---|---|---|\n| `French` | 54 | Foundation deck: 13 ranks \u00d7 4 suits + Big/Little jokers; most others derive from its `FrenchBasicCard` consts |\n| `Standard52` | 52 | French minus jokers; home of the `card!`/`cards!` macros |\n| `Short` | 36 | Ranks 6 through Ace (six-plus hold'em) |\n| `Spades` | 52 | French with jokers, minus 2\u2663 and 2\u2666 |\n| `Euchre24` | 24 | 24-card Euchre variant |\n| `Euchre32` | 32 | 32-card Euchre variant |\n| `Pinochle` | 48 | Two copies of 9\u2013Ace; **Ten outranks King** |\n| `Canasta` | 108 | 2 modern decks, red 3s promoted to jokers |\n| `Skat` | 32 | German suits/ranks (own `.ftl` locale files) |\n| `Tarot` | 78 | 22 Major + 56 Minor Arcana, trump precedence |\n| `Mughal` | 96 | Mughal Ganjifa: 8 suits \u00d7 12; weak suits (Red Coins, Harps, Bills, Cloth) use **inverted pip ranking** (A > 2 > \u2026 > 10) via a second weight-inverted rank ladder |\n| `Dashavatara` | 120 | Dashavatara Ganjifa: 10 avatar suits \u00d7 12; Matsya\u2013Vamana weak (inverted pips), Parashurama\u2013Kalki strong; shares the `cards::ganjifa` vocabulary with Mughal |\n| `Razz` | 52 | **Ace-low** (inverted rank weights); built from YAML via `include_str!`; requires the `yaml` feature |\n| `Tiny` | 4 | A\u2660 K\u2660 A\u2665 K\u2665 \u2014 minimal teaching/testing deck |\n\n# The registry\n\n`DeckKind` (`src/basic/decks/registry.rs`) is a runtime enum over all 14 \u2014\n`DeckKind::all()`, `.deck_name()`, `.base_vec()`, `.fluent_deck_key()` \u2014 for\n\"give me every deck this crate ships\" use-cases the generic\n`Pile\u003cDeckType>` API can't express. The enum is `#[non_exhaustive]` (since\n0.9.0), so new decks land in minor releases; match with a wildcard arm or\niterate `DeckKind::all()`.\n\n# No dedicated multi-deck types\n\nHand-and-Foot-style games use `French::decks(n)` (4 players \u2192 216 cards)\ninstead of a bespoke deck type.\n\n# Citations\n\n[1] [src/basic/decks/registry.rs](../../src/basic/decks/registry.rs)\n[2] [DECON-05 French Deck Family](/references/decon-05-french-deck-family.md)\n[3] [DECON-06 Tarot and Skat](/references/decon-06-tarot-and-skat.md)"}, {"id": "decks/extending-decks", "type": "Playbook", "title": "Creating a custom deck", "description": "Consumers author new deck vocabularies with the same machinery as shipped decks \u2014 implement DeckedBase on a marker struct, then Decked for free methods.", "tags": ["decks", "extension", "playbook"], "group": "decks", "sz": 41, "body": "# Steps\n\n1. Define a marker struct (e.g. `struct Tiny {}`) with a `const DECK: [BasicCard; N]`\n   \u2014 reuse shipped consts like `FrenchBasicCard::ACE_SPADES` or define new\n   `Pip`s with your own weights.\n2. Implement `DeckedBase`: `base_vec()`, `colors()`, `deck_name()`,\n   `fluent_deck_key()` (reuse e.g. `FLUENT_KEY_BASE_NAME_FRENCH` if names map\n   onto an existing locale set).\n3. `impl Decked\u003cTiny> for Tiny {}` \u2014 unlocks `Tiny::deck()`, `decks(n)`,\n   `validate()`. `Ranged` (combos) comes automatically.\n4. Optionally add a `macro_rules!` helper for terse card literals.\n5. **Verify with `YourDeck::validate()`** \u2014 the fundamental correctness test.\n\nThe full worked example lives in the `src/lib.rs` doc comment (\"Custom Deck\nexample\") and `src/basic/decks/tiny.rs` is the in-tree version.\n\n# Alternative: decks from YAML\n\nWith the `yaml` feature, deck data can live in a YAML file deserialized by\n`BasicCard::cards_from_yaml_str` \u2014 pair with `include_str!` for a pure,\ncompile-time-embedded deck (this is exactly how\n[`Razz`](/decks/deck-catalog.md) works). Sorting behavior (e.g. Ace-low) is\ncontrolled purely by the weights in the data\n([card model](/architecture/card-model.md)).\n\n# YAML is free for your deck too\n\n`YamlDecked` is **blanket-implemented for every `DeckedBase`**, so step 2 above\nis all a consumer deck needs to get YAML \u2014 there is no second trait to write\nand deliberately no override hook, because one shared format is what makes the\ngolden fixtures and `DeckKind::from_yaml` meaningful:\n\n* `YourDeck::to_yaml()` \u2014 the canonical card list as an envelope document.\n* `YourDeck::deck_from_yaml(&s)` \u2014 parse to `Vec\u003cBasicCard>`; does **not**\n  check deck identity.\n* `YourDeck::validate_yaml(&s)` \u2014 the YAML analogue of `validate()`. This is\n  the check to run in your test suite.\n\n## The envelope format\n\nDocuments are self-describing rather than a bare card list, so a file can be\nchecked against the deck it claims to be:\n\n```yaml\nversion: 1\nname: Tiny            # matched against DeckedBase::deck_name()\nfluent_deck_key: french\ncount: 4              # must equal cards.len(), or YamlCountMismatch\ncards:\n- suit: { weight: 3, pip_type: Suit, index: 'S', symbol: '\u2660', value: 4 }\n  rank: { weight: 12, pip_type: Rank, index: 'A', symbol: 'A', value: 11 }\n```\n\nThe reader sniffs document shape: a mapping is an envelope, a sequence is the\nlegacy bare list (parsed with an empty `name`, so identity falls to the card\ncomparison). Both remain supported \u2014 see\n[the envelope decision](/decisions/yaml-envelope-format.md), which explains why\nthe legacy path **must not** be deleted.\n\n`Pile\u003cT>::to_yaml`/`from_yaml` serialize an *instance* \u2014 order preserved, empty\nallowed, multi-deck allowed. `DeckKind::to_yaml`/`from_yaml` cover the\nnon-generic, runtime-known case, but only for decks in the shipped registry;\na consumer deck uses the `YamlDecked` path.\n\n## Validate, don't assume\n\n`validate_yaml` exists because `src/basic/decks/yaml/razz_bad.yml` is the\ncautionary tale: perfectly well-formed YAML that parses without complaint and\nis still the wrong deck. Well-formed \u2260 correct. `tests/yaml_errors.rs` pins\nthat case.\n\n# Citations\n\n[1] [src/lib.rs \"Custom Deck example\" and \"Decks as YAML\"](../../src/lib.rs)\n[2] [DECON-08 Extension and Registry](/references/decon-08-extension-and-registry.md)\n[3] [EPIC-03 YAML Deck Serialization](/references/epic-03-yaml-serialization.md)"}, {"id": "getting-started", "type": "Reference", "title": "Getting started \u2014 cardpack.rs Knowledge Bundle", "description": "How this bundle is organized and where to start reading.", "tags": ["getting-started", "meta"], "group": "(root)", "sz": 28, "body": "# Overview\n\nThis bundle captures durable knowledge about **cardpack.rs**, a generic\ndeck-of-cards library in Rust. Start with the\n[crate overview](/architecture/crate-overview.md), then follow links by need:\n\n* Understanding the type system \u2192 [card model](/architecture/card-model.md)\n* Choosing Cargo features \u2192 [feature flags](/architecture/feature-flags.md)\n* Why the crate is structured the way it is \u2192 [domain kernel](/architecture/domain-kernel.md)\n* What decks exist \u2192 [deck catalog](/decks/deck-catalog.md)\n* Building / testing / releasing \u2192 [build and test](/workflows/build-and-test.md)\n\n# Layout\n\n* `architecture/` \u2014 how the crate is designed and why.\n* `decks/` \u2014 the shipped deck vocabulary and how to extend it.\n* `workflows/` \u2014 build, test, CI, and WebAssembly workflows.\n* `decisions/` \u2014 load-bearing decisions that are easy to accidentally undo.\n* `references/` \u2014 map of the in-repo documentation this bundle distills."}, {"id": "references/audit-domain-kernel", "type": "Reference", "title": "Domain-kernel audit (2026-07-18)", "description": "The kernel purity assessment at v0.7.1: the invariants the crate holds itself to and where it was found to bend them.", "tags": ["audit", "domain-kernel", "purity", "invariants"], "group": "references", "sz": 28, "body": "# What it covers\n\nA Mode-A (assess) run of the `domain-kernel` framework against cardpack at\nv0.7.1 on `main`: how close the crate is to a pure, delivery-agnostic core,\nscored against explicit invariants \u2014 no I/O in the core, no format crate in\nthe public API, no default-on serialization.\n\n# Authoritative for\n\n* **The numbered purity invariants** the rest of the bundle cites by number.\n  The distilled version is [domain kernel](/architecture/domain-kernel.md);\n  the two invariants that constrain new work most are the single filesystem\n  seam ([std-io outside full](/decisions/std-io-outside-full.md)) and boxed\n  parse errors.\n\nEarlier rounds \u2014 `docs/audit-2026-04-29.md` and `docs/audit-2026-04-09.md` \u2014\nare superseded by this one.\n\n# In-repo path\n\n`docs/audit-2026-07-18-domain-kernel.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/backlog", "type": "Reference", "title": "BACKLOG", "description": "Index of outstanding work aggregated from EPIC docs, GitHub issues, and code comments by the /backlog skill.", "tags": ["backlog", "planning", "workflow"], "group": "references", "sz": 27, "body": "# What it covers\n\nAn aggregated index of open work: EPIC docs and their status, GitHub issues,\nand `TODO`/`FIXME` comments found in source. Maintained by the `/backlog`\nskill rather than by hand, so it is a **derived** view \u2014 the linked sources\nare authoritative.\n\n# Caveats\n\n* Items tagged \ud83e\udd16 are machine-proposed suggestions, not commitments.\n* It goes stale between refreshes; check the \"last refreshed\" line at the top\n  before trusting a status. Debt detail lives in\n  [technical debt](/references/technical-debt.md).\n\n# In-repo path\n\n`BACKLOG.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/changelog", "type": "Reference", "title": "CHANGELOG", "description": "Keep-a-Changelog per-version history; the authoritative record of what changed in each release and what broke.", "tags": ["changelog", "releases", "semver"], "group": "references", "sz": 27, "body": "# What it covers\n\nEvery released version in Keep a Changelog form, with a `### Breaking` section\nwhere a release carried one. The `[Unreleased]` section at the top is the\nstaging area, renamed at tag time.\n\n# Authoritative for\n\n* **What changed in which version**, and which changes were semver-breaking.\n  Both `DeckKind` and `CardError` became `#[non_exhaustive]` this way \u2014 see\n  [deck catalog](/decks/deck-catalog.md) and\n  [YAML envelope format](/decisions/yaml-envelope-format.md).\n* Narrative release notes for the 0.7.0 series live separately in\n  [release v0.7.0](/references/release-v0-7-0.md).\n\n# In-repo path\n\n`CHANGELOG.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/decon-01-card-model", "type": "Reference", "title": "DECON-01 \u2014 Card model and ordering", "description": "The atomic unit of the domain: a card as a rank facet plus a suit facet, and the rule that gives a set of cards one canonical order.", "tags": ["decon", "regeneration-spec", "card-model", "ordering"], "group": "references", "sz": 26, "body": "# What it covers\n\nA **card** built from two independent facets \u2014 a rank facet and a suit facet \u2014\nplus the rule that turns a set of cards into one canonical order. Every other\nepic in the pack builds on this slice.\n\n# Relationship to the implementation\n\nThe distilled view of how this crate does it is\n[card model](/architecture/card-model.md). Nothing in the DECON doc mandates\nthe Rust implementation; source citations there are non-normative.\n\n# In-repo path\n\n`docs/deconstruct/DECON-01_Card_Model_And_Ordering.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/decon-02-pile-operations", "type": "Reference", "title": "DECON-02 \u2014 Pile operations", "description": "The pile as an ordered multiset over one deck vocabulary, and the operations on it: construction, drawing, sorting, extraction.", "tags": ["decon", "regeneration-spec", "pile"], "group": "references", "sz": 26, "body": "# What it covers\n\nThe **pile** \u2014 an ordered multiset of cards drawn from one deck vocabulary \u2014\nand the operations a consumer performs on it: construction, drawing, sorting,\nand extraction/filtering. Builds directly on\n[DECON-01](/references/decon-01-card-model.md).\n\n# In-repo path\n\n`docs/deconstruct/DECON-02_Pile_Operations.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/decon-03-shuffling", "type": "Reference", "title": "DECON-03 \u2014 Shuffling and determinism", "description": "Permuting a pile without changing its multiset, plus the seeding property that makes shuffling reproducible and testable.", "tags": ["decon", "regeneration-spec", "shuffle", "determinism"], "group": "references", "sz": 26, "body": "# What it covers\n\n**Shuffling** a pile \u2014 permuting its cards while leaving the multiset itself\nunchanged \u2014 plus the one determinism property that makes shuffling testable:\nseeding. Builds on [DECON-02](/references/decon-02-pile-operations.md).\n\n# Why it is load-bearing here\n\nThe determinism clause is what makes rand's `std_rng` non-negotiable under\n`no_std` \u2014 see\n[rand's std_rng stays unconditional](/decisions/rand-std-rng-unconditional.md).\n\n# In-repo path\n\n`docs/deconstruct/DECON-03_Shuffling_And_Determinism.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/decon-05-french-deck-family", "type": "Reference", "title": "DECON-05 \u2014 French deck family", "description": "Nine deck vocabularies built from the standard four-suit vocabulary \u2014 whole, subset, extended, duplicated, re-ranked, or reordered.", "tags": ["decon", "regeneration-spec", "decks", "french"], "group": "references", "sz": 26, "body": "# What it covers\n\nNine deck **vocabularies** of the \"French family\" \u2014 all built from the\nstandard four-suit vocabulary of\n[DECON-01](/references/decon-01-card-model.md), either whole, subset,\nextended, duplicated, locally re-ranked, or emitted in a non-default order.\nEach is fully determined by its definition.\n\n# The shipped equivalents\n\nSee [deck catalog](/decks/deck-catalog.md) for which `DeckKind` variants\nthese correspond to.\n\n# In-repo path\n\n`docs/deconstruct/DECON-05_French_Deck_Family.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/decon-06-tarot-and-skat", "type": "Reference", "title": "DECON-06 \u2014 Tarot and Skat", "description": "Two vocabularies sharing no cards, suits, or ranks with the French family: Tarot (78) and Skat (32).", "tags": ["decon", "regeneration-spec", "decks", "tarot", "skat"], "group": "references", "sz": 27, "body": "# What it covers\n\nTwo deck **vocabularies** that share no cards, suits, or ranks with the French\nfamily ([DECON-05](/references/decon-05-french-deck-family.md)): **Tarot**\n(78 cards, Major and Minor Arcana) and **Skat** (32 cards, German-suited).\nBoth are expressed entirely in terms of\n[DECON-01](/references/decon-01-card-model.md)'s card model.\n\n# Why they matter\n\nThey are the proof that the card model is vocabulary-agnostic \u2014 the same\nproperty [extending decks](/decks/extending-decks.md) relies on.\n\n# In-repo path\n\n`docs/deconstruct/DECON-06_Tarot_And_Skat.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/decon-07-localization", "type": "Reference", "title": "DECON-07 \u2014 Localization", "description": "Localized naming as observable behavior: every rank, suit, and card name resolves to a specific string per supported locale.", "tags": ["decon", "regeneration-spec", "localization"], "group": "references", "sz": 27, "body": "# What it covers\n\n**Localized naming** as observable behavior: every rank facet, every suit\nfacet, and every full card name resolves to a specific string per supported\nlocale, for every vocabulary defined in\n[DECON-05](/references/decon-05-french-deck-family.md) and\n[DECON-06](/references/decon-06-tarot-and-skat.md).\n\n# Relationship to the implementation\n\nThe distilled view of the Fluent-backed implementation is\n[localization](/architecture/localization.md).\n\n# In-repo path\n\n`docs/deconstruct/DECON-07_Localization.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/decon-08-extension-and-registry", "type": "Reference", "title": "DECON-08 \u2014 Extension and registry", "description": "The extension surface: defining a new deck vocabulary from the same public machinery every shipped deck uses, plus the administrative registry.", "tags": ["decon", "regeneration-spec", "extension", "registry"], "group": "references", "sz": 27, "body": "# What it covers\n\nThe domain's **extension surface** \u2014 how a consumer defines a brand-new deck\nvocabulary using the same public machinery every shipped deck is built from\n([DECON-05](/references/decon-05-french-deck-family.md),\n[DECON-06](/references/decon-06-tarot-and-skat.md)) and gains full pile,\nformat, and validation behavior automatically \u2014 plus the **administrative\nregistry** that enumerates the shipped vocabularies.\n\n# The shipped equivalents\n\n[extending decks](/decks/extending-decks.md) is the crate-specific playbook;\n[deck catalog](/decks/deck-catalog.md) is the registry's current contents.\n\n# In-repo path\n\n`docs/deconstruct/DECON-08_Extension_And_Registry.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/decon-manifest", "type": "Reference", "title": "DECON MANIFEST \u2014 regeneration pack", "description": "The contract for the /deconstruct regeneration pack: satisfy every DECON epic and reproduce all golden vectors, in any language.", "tags": ["decon", "regeneration-spec", "manifest", "contract"], "group": "references", "sz": 28, "body": "# What it covers\n\nThe index and contract for the regeneration pack: an implementation **in any\nlanguage** that satisfies every DECON epic and reproduces all golden vectors\nis a functional regeneration of this crate. Language, layout, and internal\ndesign are the implementer's choice.\n\n# Pinning\n\nPinned to commit `24ad604f4bb29e51de0c2835d149c8e0aea91854` (2026-07-18).\nGolden vectors under `docs/deconstruct/vectors/*.json` are regenerated with\n`cargo run --example deconstruct_vectors`.\n\n# The epics\n\n[DECON-01](/references/decon-01-card-model.md),\n[02](/references/decon-02-pile-operations.md),\n[03](/references/decon-03-shuffling.md),\n[05](/references/decon-05-french-deck-family.md),\n[06](/references/decon-06-tarot-and-skat.md),\n[07](/references/decon-07-localization.md),\n[08](/references/decon-08-extension-and-registry.md).\n\n# In-repo path\n\n`docs/deconstruct/MANIFEST.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/docs-map", "type": "Reference", "title": "Map of the in-repo documentation", "description": "Where the deep documentation lives \u2014 DECON regeneration pack, EPICs, audits, design docs, technical debt \u2014 and which file is authoritative for what.", "tags": ["docs", "map", "reference"], "group": "references", "sz": 37, "body": "# Authoritative sources by topic\n\nEach row links to this bundle's mirror concept; the in-repo path beside it is\nthe authoritative document.\n\n| Topic | Authoritative doc |\n|---|---|\n| Language-agnostic behavioral spec + golden vectors | [DECON MANIFEST](/references/decon-manifest.md) \u2014 `docs/deconstruct/MANIFEST.md` \u2192 DECON-01\u202608 + `vectors/*.json` (regenerate via `cargo run --example deconstruct_vectors`) |\n| Kernel purity assessment | [domain-kernel audit](/references/audit-domain-kernel.md) \u2014 `docs/audit-2026-07-18-domain-kernel.md` (earlier: audit-2026-04-29, audit-2026-04-09) |\n| Balatro/funky scope & status | [EPIC-01 Funky](/references/epic-01-funky.md) + children 01a\u201301e (all closed 2026-07-18) |\n| Ganjifa decks | [EPIC-02 Ganjifa](/references/epic-02-ganjifa.md) |\n| YAML deck serialization | [EPIC-03 YAML Deck Serialization](/references/epic-03-yaml-serialization.md) |\n| Effect/mod registry design | [effect registry design](/references/effect-registry-design.md) \u2014 `docs/2026-07-11-effect-registry-design.md` |\n| Seeded shuffle design | [seeded shuffle design](/references/seeded-shuffle-design.md) \u2014 `docs/2026-04-29-seeded-shuffle-design.md` |\n| Latin/Klingon locale design | [la/tlh locales design](/references/la-tlh-locales-design.md) \u2014 `docs/2026-04-29-la-tlh-locales-design.md` |\n| no_std/alloc migration design | [no_std + alloc design](/references/no-std-alloc-design.md) \u2014 `docs/superpowers/specs/2026-05-01-no-std-alloc-design.md` |\n| Outstanding work | [BACKLOG](/references/backlog.md) and [technical debt](/references/technical-debt.md) (both maintained by the `/backlog` skill) |\n| WASM consumer setup | [wasm guide](/references/wasm-guide.md) \u2014 `docs/wasm.md` ([wasm workflow](/workflows/wasm.md) is the distilled version) |\n| Release history | [CHANGELOG](/references/changelog.md); narrative notes in [release v0.7.0](/references/release-v0-7-0.md) |\n| Crate front door | [README](/references/readme.md) |\n\n# Conventions\n\n* **EPIC docs** (`docs/EPIC-NN_*.md`) are durable, phase-structured specs with\n  status tables; the EPIC is the single source of truth for its scope \u2014\n  TECHNICAL_DEBT.md mirrors it and has gone stale before (noted in-file).\n* **DECON docs** are the /deconstruct output: a contract such that any\n  implementation reproducing all golden vectors is a functional regeneration\n  of this crate, pinned to commit `24ad604` (2026-07-18).\n* **Mirror concepts.** Every document above has a stub concept in\n  `references/`, so cross-links from elsewhere in the bundle stay\n  bundle-relative (SPEC \u00a75.1) instead of escaping the bundle. The stubs are\n  pointers, not copies \u2014 they carry a description and a `resource:` URI, and\n  the in-repo document remains authoritative.\n\n# Citations\n\n[1] [DECON MANIFEST](/references/decon-manifest.md)"}, {"id": "references/effect-registry-design", "type": "Reference", "title": "Design \u2014 open effect interpretation (mod / effect registry)", "description": "How funky effects are dispatched openly rather than through a closed match, written for EPIC-01 Story 8.", "tags": ["design", "funky", "effects", "registry"], "group": "references", "sz": 26, "body": "# What it covers\n\nThe design for open effect interpretation in the funky engine \u2014 letting\neffects be registered and dispatched rather than hard-matched, so a consumer\ncan add one without editing the crate.\n\n# Context\n\nWritten 2026-07-11 on the `funky` branch for\n[EPIC-01](/references/epic-01-funky.md) Story 8. The distilled architecture\nview is [funky engine](/architecture/funky-engine.md).\n\n# In-repo path\n\n`docs/2026-07-11-effect-registry-design.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/epic-01-funky", "type": "Reference", "title": "EPIC-01 \u2014 Funky (Balatro-style cards)", "description": "The Balatro-style joker/effect engine: scope, the five child EPICs, and the deferrals recorded at close-out.", "tags": ["epic", "funky", "balatro", "closed"], "group": "references", "sz": 28, "body": "# What it covers\n\nThe `BuffoonCard` / `BuffoonPile` type family and the scoring engine built on\nit \u2014 the solver path (`score()` / `score_with_seed()`, four phases, never\npanics, seeded shuffle) and the joker/effect surface around it.\n\n# Status\n\nClosed 2026-07-18 at tip `e50fdd0`, with named deferrals. All five children\nare closed: 01a Joker Wiring, 01b Shop, 01c Vouchers, 01d Editions (2026-07-16\n\u2013 07-17), and 01e Spectral Cards (2026-07-18, seal spectrals deferred).\n\n# Authoritative for\n\n* The funky scope boundary. The distilled architecture view is\n  [funky engine](/architecture/funky-engine.md); the effect-dispatch design is\n  [effect registry design](/references/effect-registry-design.md).\n\n# In-repo path\n\n`docs/EPIC-01_Funky.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/epic-02-ganjifa", "type": "Reference", "title": "EPIC-02 \u2014 Ganjifa decks (Mughal + Dashavatara)", "description": "Adding the two Ganjifa decks with per-suit inverted pip ranking, full localization, and registry integration.", "tags": ["epic", "decks", "ganjifa", "closed"], "group": "references", "sz": 27, "body": "# What it covers\n\nAdding **Mughal Ganjifa** (8 suits \u00d7 12 = 96 cards) and **Dashavatara\nGanjifa** (10 suits \u00d7 12 = 120 cards) as first-class decks, including the\nsignature per-suit inverted pip ranking, Fluent localization in all five\nlocales, and `DeckKind` registry integration.\n\n# Why it matters downstream\n\n* It is what made the registry sweep 14 decks wide \u2014 the basis of every\n  \"for each shipped deck\" guarantee in\n  [EPIC-03](/references/epic-03-yaml-serialization.md).\n* It set the `#[non_exhaustive]` semver precedent for `DeckKind`, later\n  followed for `CardError`. See [deck catalog](/decks/deck-catalog.md).\n\n# In-repo path\n\n`docs/EPIC-02_Ganjifa.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/epic-03-yaml-serialization", "type": "Reference", "title": "EPIC-03 \u2014 YAML deck serialization", "description": "The DeckYaml envelope, the YamlDecked blanket trait, and the three-layer test suite that makes every deck round-trip through YAML.", "tags": ["epic", "yaml", "serialization", "closed"], "group": "references", "sz": 28, "body": "# What it covers\n\nMaking every deck round-trip `deck \u2192 YAML \u2192 deck`: the self-describing\n`DeckYaml` envelope (`version`, `name`, `fluent_deck_key`, `count`, `cards`),\nthe `YamlDecked` blanket trait over `DeckedBase`, symmetric `to_yaml` /\n`from_yaml` on both `DeckKind` and `Pile\u003cT>`, and six gated `CardError`\nvariants \u2014 all behind the existing `yaml` feature.\n\n# Authoritative for\n\n* **The envelope's shape and its back-compat rule.** The load-bearing\n  consequence is captured separately in\n  [YAML envelope format](/decisions/yaml-envelope-format.md): the legacy\n  bare-sequence reader must not be deleted, because `Razz` depends on it at\n  build time.\n* The three-layer test plan \u2014 round-trip, byte-level golden fixtures, and\n  negative paths \u2014 including the `razz_bad.yml` failure mode.\n\n# In-repo path\n\n`docs/EPIC-03_Yaml_Deck_Serialization.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/la-tlh-locales-design", "type": "Reference", "title": "Design \u2014 Latin (la) and Klingon (tlh) locales", "description": "Adding two non-natural-language locales, and the Fluent schema fixes that came with them.", "tags": ["design", "localization", "fluent", "locales"], "group": "references", "sz": 26, "body": "# What it covers\n\nAdding the Latin (`la`) and Klingon (`tlh`) locales to the Fluent translation\nset, including the `de`/tarot schema fix that preceded them.\n\n# Context\n\nWritten 2026-04-29 on the `gapped` branch. The distilled view of how\nlocalization works is [localization](/architecture/localization.md); the\nlanguage-agnostic contract is\n[DECON-07](/references/decon-07-localization.md).\n\n# In-repo path\n\n`docs/2026-04-29-la-tlh-locales-design.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/no-std-alloc-design", "type": "Reference", "title": "Design \u2014 no_std + alloc support (0.7.0)", "description": "The plan for making the crate build without std while keeping alloc-backed types, targeting the 0.7.0 release.", "tags": ["design", "no_std", "alloc", "portability"], "group": "references", "sz": 26, "body": "# What it covers\n\nThe design for `no_std` + `alloc` support: which types stay, what moves behind\nthe default-on `std` feature, and how the bare-metal and wasm targets get\nverified in CI.\n\n# Context\n\nWritten 2026-05-01 targeting 0.7.0. The gates that keep it true today are\n`make no-std` and the CI matrix \u2014 see\n[build and test](/workflows/build-and-test.md) and\n[domain kernel](/architecture/domain-kernel.md).\n\n# In-repo path\n\n`docs/superpowers/specs/2026-05-01-no-std-alloc-design.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/readme", "type": "Reference", "title": "README", "description": "The crate's front door: what cardpack is, the cargo feature table, install snippets, and the deck roster.", "tags": ["readme", "features", "overview"], "group": "references", "sz": 27, "body": "# What it covers\n\nThe consumer-facing introduction to the crate \u2014 what a `Pile\u003cDeckType>` is,\nthe full cargo feature table with what each flag pulls in, install snippets\nfor the common feature stacks, and the roster of shipped decks.\n\n# Authoritative for\n\n* The **feature table as consumers see it** \u2014 the prose explanation of `full`\n  vs `std-io`, and which flags imply which. The machine-readable truth is\n  `Cargo.toml`; see [feature flags](/architecture/feature-flags.md) for the\n  distilled version.\n\n# In-repo path\n\n`README.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/release-v0-7-0", "type": "Reference", "title": "Release notes \u2014 v0.7.0", "description": "A single narrative summary of the v0.6.8 \u2192 v0.7.0 series, complementing the per-version changelog.", "tags": ["release", "changelog", "narrative"], "group": "references", "sz": 26, "body": "# What it covers\n\nOne narrative pass over everything that landed across v0.6.9 \u2013 v0.7.0\n(released 2026-05-02), rather than the per-version bullet form.\n\n# Relationship to the changelog\n\n[CHANGELOG.md](/references/changelog.md) remains the authoritative\nper-version record; this document exists to make the series readable as a\nstory.\n\n# In-repo path\n\n`docs/release-v0.7.0.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/seeded-shuffle-design", "type": "Reference", "title": "Design \u2014 deterministic shuffle", "description": "The design behind shuffle_with_seed / shuffle_with_rng and the reproducibility property the test suite is built on.", "tags": ["design", "shuffle", "determinism", "no_std"], "group": "references", "sz": 27, "body": "# What it covers\n\nThe design for `shuffle_with_seed` / `shuffle_with_rng`: permuting a pile\nwhile leaving its multiset of cards unchanged, and the seeding property that\nmakes a failing shuffle reproducible from its seed.\n\n# Why it constrains the build\n\nDeterminism has to hold under `no_std`, which is why rand's `std_rng` feature\nis unconditional \u2014 see\n[rand's std_rng stays unconditional](/decisions/rand-std-rng-unconditional.md).\nThe language-agnostic contract is\n[DECON-03](/references/decon-03-shuffling.md).\n\n# In-repo path\n\n`docs/2026-04-29-seeded-shuffle-design.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/technical-debt", "type": "Reference", "title": "Technical debt register", "description": "Tracked debt sourced from TODO / TODO RF / TODO: HACK comments and EPIC docs, maintained by the /backlog skill.", "tags": ["debt", "backlog", "maintenance"], "group": "references", "sz": 26, "body": "# What it covers\n\nThe debt register: refactors flagged `TODO RF` in source, hacks flagged\n`TODO: HACK`, and deferrals carried over from EPIC docs, each with a pointer\nto where it lives in the code.\n\n# Caveats\n\n* Items tagged \ud83e\udd16 were proposed by automated review \u2014 suggestions, not facts.\n* It **mirrors** EPIC docs rather than superseding them, and has drifted out\n  of sync with them before (noted in-file). When the two disagree, the EPIC\n  wins.\n\n# In-repo path\n\n`docs/TECHNICAL_DEBT.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "references/wasm-guide", "type": "Reference", "title": "Using cardpack on WebAssembly", "description": "Consumer-side setup for wasm32-unknown-unknown: the getrandom wasm_js backend, the verified feature matrix, and runtime gotchas.", "tags": ["wasm", "workflow", "consumer-setup"], "group": "references", "sz": 27, "body": "# What it covers\n\nThe consumer-side guide to running cardpack in the browser: the\n`.cargo/config.toml` entries a consuming crate needs, which feature\ncombinations are verified against `wasm32-unknown-unknown`, and the runtime\ngotchas that only show up in a browser.\n\n# Authoritative for\n\n* **The `getrandom` backend requirement.** cardpack compiles to wasm cleanly,\n  but a consumer must select the `wasm_js` backend themselves \u2014 this is the\n  detail that makes seeded shuffle work in a browser. The bundle's distilled\n  version is the [wasm workflow](/workflows/wasm.md).\n\n# In-repo path\n\n`docs/wasm.md`\n\nThis concept is a pointer, not a copy \u2014 the linked document is authoritative."}, {"id": "workflows/build-and-test", "type": "Playbook", "title": "Build, test, and quality gates", "description": "make (ayce) is the everything gate \u2014 fmt, build, three test layers, clippy-pedantic, MSRV, no_std, docs; plus mutants, miri, coverage, and deny.", "tags": ["workflow", "make", "ci", "testing"], "group": "workflows", "sz": 34, "body": "# Day-to-day\n\n```shell\nmake            # default target `ayce` (\"all you can eat\"):\n                # fmt \u2192 build \u2192 test-unit/doc/std-io \u2192 clippy \u2192 msrv \u2192 no-std \u2192 docs\nmake help       # list all targets\n```\n\nTest layers: `test-unit`, `test-doc` (101+ doctests), `test-std-io` (the\nfilesystem seam gets its own pass since `std-io` is outside `full` \u2014\n[decision](/decisions/std-io-outside-full.md)).\n\n# Portability gates\n\n* `make no-std` \u2014 builds `--no-default-features` including bare-metal\n  (`thumbv7em-none-eabihf`); dev-deps are target-gated in Cargo.toml so this\n  works.\n* `make build-wasm` / `make test-wasm` \u2014 wasm32 ([wasm](/workflows/wasm.md)).\n* `make msrv` \u2014 Rust 1.85 check.\n\n# Deeper verification\n\n* `make mutants` \u2014 cargo-mutants mutation testing.\n* `make miri`, `make coverage` (llvm-cov \u2192 codecov), `make bench` (criterion\n  `benches/draw.rs`), `make deny` / `make audit` / `make unused-deps`.\n* `make nightly` \u2014 nightly test + clippy.\n* Property tests: `tests/properties.rs` (proptest).\n\n# Golden YAML fixtures\n\n`make yaml-fixtures` runs `cargo ex yaml_decks`, regenerating one fixture per\n`DeckKind` into `tests/fixtures/yaml/`. It is **idempotent**: run it twice and\n`git status` is clean the second time, so CI can assert\n`git diff --exit-code tests/fixtures/yaml/`.\n\n`tests/yaml_golden.rs` compares generated output to those files **byte-for-byte**,\nwhich makes `serde_norway`'s formatting part of the contract \u2014 a dependency bump\nthat changes quoting or indentation is *supposed* to turn it red. Regenerate,\nreview the diff, note it in the CHANGELOG; do not loosen the comparison\n([envelope decision](/decisions/yaml-envelope-format.md)). A companion test\npins the fixture count to `DeckKind::all().len()`, so a 15th deck cannot land\nwithout a fixture.\n\n# Conventions\n\n* Clippy runs at `-Dpedantic --all-targets` and must stay clean; `unwrap`/\n  `expect` are only allowed under `cfg(test)`.\n* CI is `.github/workflows/CI.yaml` (build/test badge on the README); codecov\n  tracks coverage.\n* Test framework: `rstest` for fixture/case tables.\n\n# Citations\n\n[1] [Makefile](../../Makefile)\n[2] [.github/workflows/CI.yaml](../../.github/workflows/CI.yaml)"}, {"id": "workflows/wasm", "type": "Playbook", "title": "WebAssembly support", "description": "cardpack compiles to wasm32-unknown-unknown with every feature combination; consumers must configure the getrandom wasm_js backend.", "tags": ["wasm", "portability", "getrandom"], "group": "workflows", "sz": 30, "body": "# Status\n\nThe crate builds cleanly for `wasm32-unknown-unknown` (browser WASM) with\nevery feature combination, a direct payoff of the\n[domain-kernel](/architecture/domain-kernel.md) posture.\n\n# The getrandom seam\n\n`rand 0.9 \u2192 rand_core 0.9 \u2192 getrandom 0.3` forces wasm32 consumers to pick a\nbackend, else builds fail with \"no backend selected\". cardpack pre-enables the\n`wasm_js` feature on `getrandom` for wasm targets in its own Cargo.toml, but\n**consumers still must set the cfg flag themselves**, typically in\n`.cargo/config.toml`:\n\n```toml\n[target.wasm32-unknown-unknown]\nrustflags = ['--cfg', 'getrandom_backend=\"wasm_js\"']\n```\n\n# Where to look\n\n* [wasm guide](/references/wasm-guide.md) (`docs/wasm.md`) \u2014 backend setup,\n  recommended feature combos, runtime gotchas.\n* [examples/wasm.rs](../../examples/wasm.rs) \u2014 working example.\n* `tests/wasm.rs` \u2014 wasm-bindgen-test suite (`make test-wasm`).\n\nSeeded shuffle works on wasm and no_std alike because `StdRng` comes from\nrand's `std_rng` feature, enabled unconditionally \u2014\n[see the decision](/decisions/rand-std-rng-unconditional.md).\n\n# Citations\n\n[1] [docs/wasm.md](/references/wasm-guide.md)\n[2] [Cargo.toml wasm32 target section](../../Cargo.toml)"}], EDGES=[{"source": "architecture/card-model", "target": "decks/extending-decks"}, {"source": "architecture/card-model", "target": "references/technical-debt"}, {"source": "architecture/card-model", "target": "references/decon-01-card-model"}, {"source": "architecture/card-model", "target": "references/decon-02-pile-operations"}, {"source": "architecture/crate-overview", "target": "decks/deck-catalog"}, {"source": "architecture/crate-overview", "target": "architecture/localization"}, {"source": "architecture/crate-overview", const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?DOMPurify.sanitize(marked.parse(n.body)):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.batch(()=>cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');}));}
let debounce;
document.getElementById('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(applyFilter,150);};
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
let curLayout='cose';
document.getElementById('layout').onchange=e=>{const v=e.target.value;
 if(v==='cose'&&NODES.length>1000&&!confirm(`force layout on ${NODES.length} concepts can freeze this tab — run anyway?`)){e.target.value=curLayout;return;}
 curLayout=v;cy.layout({name:v,animate:true,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
